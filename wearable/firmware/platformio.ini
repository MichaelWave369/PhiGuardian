; Bench prototype ONLY. No BLE, cloud, microphone, remote emergency services.
; Seeed documents this board ID and its PlatformIO platform.
[env:guardian_node]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1.1.0
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
lib_deps =
    seeed-studio/Seeed Arduino LSM6DS3@2.0.7
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DPHIGUARDIAN_USB_DIAGNOSTICS=0
